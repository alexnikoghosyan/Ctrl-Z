# Web build and itch.io deploy (docs/deploy.md).
# - pull_request: export the Web build and attach it to the run as an artifact (no deploy).
# - push of a tag v* (a release on main, docs/workflow.md §6): export and push to itch.io with butler.
# - workflow_dispatch: the same by hand, from any branch; deploy only if "deploy" is ticked.
name: Deploy

on:
  pull_request:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      deploy:
        description: Push the build to itch.io
        type: boolean
        default: false

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    env:
      GODOT_VERSION: 4.7.2
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Cache Godot and Web templates
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-web-${{ env.GODOT_VERSION }}-linux-x86_64

      # The full templates archive is ~1 GB; only the Web ones are kept in the cache.
      - name: Download Godot and Web templates
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          mkdir -p ~/godot
          curl -sSL -o godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip -d ~/godot
          mv ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot/godot
          curl -sSL -o templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          tdir=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p "$tdir"
          unzip -q -j templates.tpz 'templates/web_nothreads_*' 'templates/version.txt' -d "$tdir"
          rm godot.zip templates.tpz
          ls -la "$tdir"

      - name: Import project
        run: |
          rm -rf .godot
          ~/godot/godot --headless --path . --import

      - name: Export Web build
        run: |
          mkdir -p builds/web
          ~/godot/godot --headless --path . --export-release "Web" builds/web/index.html
          test -s builds/web/index.pck || { echo "::error::Export produced no index.pck"; exit 1; }
          ls -la builds/web

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-${{ github.sha }}
          path: builds/web
          retention-days: 14

      - name: Push to itch.io
        if: startsWith(github.ref, 'refs/tags/v') || inputs.deploy
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
          ITCH_GAME: ${{ vars.ITCH_GAME }}
        run: |
          [ -n "$BUTLER_API_KEY" ] || { echo "::error::Secret BUTLER_API_KEY is not set (docs/deploy.md)"; exit 1; }
          [ -n "$ITCH_GAME" ] || { echo "::error::Variable ITCH_GAME (user/game) is not set (docs/deploy.md)"; exit 1; }
          curl -sSL -o butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip -q butler.zip -d ~/butler
          chmod +x ~/butler/butler
          version=$(git describe --tags --always)
          ~/butler/butler push builds/web "$ITCH_GAME:web" --userversion "$version"
          ~/butler/butler status "$ITCH_GAME:web"
