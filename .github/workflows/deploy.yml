# Web build and itch.io deploy for Ctrl-Z (Godot 3.6.2)
name: Deploy Ctrl-Z

on:
  pull_request:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      deploy:
        description: Push Ctrl-Z build to itch.io
        type: boolean
        default: false

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    env:
      GODOT_VERSION: 3.6.2
      ITCH_GAME_SLUG: ${{ vars.ITCH_GAME || 'HAYQ333/ctrl-z' }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Cache Godot and Web templates
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/templates
          key: godot-web-${{ env.GODOT_VERSION }}-linux-x86_64

      - name: Download Godot 3.6.2 Headless and Web templates
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          mkdir -p ~/godot
          curl -sSL -o godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux_headless.64.zip"
          unzip -q godot.zip -d ~/godot
          mv ~/godot/Godot_v${GODOT_VERSION}-stable_linux_headless.64 ~/godot/godot
          chmod +x ~/godot/godot
          curl -sSL -o templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          tdir=~/.local/share/godot/templates/${GODOT_VERSION}.stable
          mkdir -p "$tdir"
          unzip -q -j templates.tpz 'templates/webassembly_*' 'templates/version.txt' -d "$tdir"
          rm godot.zip templates.tpz
          ls -la "$tdir"

      - name: Import project assets
        run: |
          rm -rf .import
          ~/godot/godot --no-window --quit --path .

      - name: Export Web build
        run: |
          mkdir -p builds/web
          ~/godot/godot --no-window --path . --export "Web" builds/web/index.html
          test -s builds/web/index.pck || { echo "::error::Export produced no index.pck"; exit 1; }
          ls -la builds/web

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ctrl-z-web-${{ github.sha }}
          path: builds/web
          retention-days: 14

      - name: Push to itch.io
        if: startsWith(github.ref, 'refs/tags/v') || inputs.deploy
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          [ -n "$BUTLER_API_KEY" ] || { echo "::error::Secret BUTLER_API_KEY is not set"; exit 1; }
          curl -sSL -o butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip -q butler.zip -d ~/butler
          chmod +x ~/butler/butler
          version=$(git describe --tags --always)
          ~/butler/butler push builds/web "$ITCH_GAME_SLUG:web" --userversion "$version"
          ~/butler/butler status "$ITCH_GAME_SLUG:web"
